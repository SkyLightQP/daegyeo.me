# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json

language: "ko-KR"
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  sequence_diagrams: true
  changed_files_summary: true
  estimate_code_review_effort: true

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"

  path_filters:
    - "!**/node_modules/**"
    - "!**/.next/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/coverage/**"
    - "!**/*.lock"
    - "!**/pnpm-lock.yaml"
    - "!**/*.min.js"
    - "!public/**"
    - "!src/components/ui/**"

  path_instructions:
    - path: "src/app/api/**/*.ts"
      instructions: >
        Next.js Route Handler입니다. withAdmin 등 인증/인가 누락, zod 스키마를 통한 입력값
        검증 누락, 에러 응답에 내부 정보가 노출되는지를 중점적으로 확인해주세요.
    - path: "src/lib/supabase/**/*.ts"
      instructions: >
        Supabase 클라이언트/서버 코드입니다. 서비스 롤 키(service role key)가 클라이언트
        번들에 노출되지 않는지, RLS(Row Level Security)를 우회하는 쿼리가 없는지 확인해주세요.
    - path: "**/*.tsx"
      instructions: >
        React 19 / Next.js App Router 컨벤션을 따릅니다. 불필요한 'use client' 남용,
        useEffect 오남용, 접근성(a11y) 이슈, 상대경로 대신 '@/' alias 사용 여부를 확인해주세요.
    - path: "**/*.test.{ts,tsx}"
      instructions: >
        vitest 테스트 코드입니다. 실제 동작을 검증하지 않는 스냅샷/타입 단정 위주 테스트나
        불필요하게 과도한 mocking을 지적해주세요. (특히 spy 남발)

  tools:
    eslint:
      enabled: true
    gitleaks:
      enabled: true
    markdownlint:
      enabled: true
    languagetool:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: auto
